<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="404 - Target Not Found" />
<meta name="theme-color" content="#050b08" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☠</text></svg>">
<title>404 // TARGET NOT FOUND</title>
<style>
:root{--bg:#050b08;--line:rgba(0,255,65,0.6);--primary:#00ff41;--red:#ff4d4d;--dim:#7c9b87;}
*{box-sizing:border-box;}body{margin:0;font-family:Consolas,monospace;background:radial-gradient(circle at top,rgba(255,77,77,0.12),transparent 60%),linear-gradient(180deg,#020805,var(--bg));color:var(--primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;}
canvas#matrix{position:fixed;inset:0;z-index:-1;opacity:0.35;}
.card{background:linear-gradient(180deg,rgba(16,10,10,0.92),rgba(5,11,8,0.85));border:1px solid rgba(255,77,77,0.6);border-radius:18px;padding:36px 28px;max-width:540px;width:100%;text-align:center;box-shadow:0 0 24px rgba(255,77,77,0.2);position:relative;z-index:10;}
h1{color:var(--red);font-size:clamp(3rem,8vw,4.5rem);margin:0;text-shadow:0 0 15px rgba(255,77,77,0.8);}
p{color:#dfffe9;line-height:1.6;margin:16px 0 24px;}
.btn{display:inline-block;padding:12px 22px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--primary);background:rgba(0,0,0,0.7);transition:all 0.2s ease;}
.btn:hover{background:var(--primary);color:#000;}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="card">
<h1>404</h1>
<div style="color:var(--red);font-weight:bold;">[ ALERT: TARGET NOT FOUND // ACCESS DENIED ]</div>
<p>Halaman atau direktori yang kamu cari tidak ada di sistem server, sudah dipindahkan, atau telah dienkripsi ulang.</p>
<!-- Tautan absolut '/' memastikan tombol selalu kembali ke halaman utama dari sub-folder mana pun -->
<a class="btn" href="/">← RETURN TO BASE // HOME</a>
</div>

<script>
const canvas=document.getElementById('matrix');const ctx=canvas.getContext('2d');
function setSize(){canvas.width=innerWidth;canvas.height=innerHeight;}
const matrixChars='0123456789ABCDEF!@#$%&*アカサタナハマヤラワ';
let drops=[];function init(){drops=Array.from({length:Math.floor(canvas.width/14)},()=>Math.random()*-100);}
function draw(){ctx.fillStyle='rgba(5,11,8,0.14)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font='16px monospace';for(let i=0;i<drops.length;i++){ctx.fillStyle=Math.random()>0.85?'#ff4d4d':'#00ff41';ctx.fillText(matrixChars[Math.floor(Math.random()*matrixChars.length)],i*14,drops[i]*16);if(drops[i]*16>canvas.height && Math.random()>0.975)drops[i]=0;drops[i]++;}}
setSize();init();addEventListener('resize',()=>{setSize();init();});

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!prefersReducedMotion){
  let lastTime=0;
  function animate(time){if(time-lastTime>70){draw();lastTime=time;}requestAnimationFrame(animate);}
  requestAnimationFrame(animate);
} else {
  draw();
}
</script>
</body>
</html>
