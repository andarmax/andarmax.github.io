name: Portfolio CI Linter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Key Files Exist
        run: |
          test -f index.html || exit 1
          test -f writeups.html || exit 1
          test -f roadmap.html || exit 1
          test -f .well-known/security.txt || exit 1
          echo "All critical security and web artifacts verified."

      - name: Validate HTML/CSS/content references + sitemap + security.txt
        run: |
          python3 - <<'PY'
          import datetime as dt
          import pathlib
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          REPO = pathlib.Path(".")
          LOCAL_DOMAIN = "andarmax.github.io"
          errors = []

          def err(message: str) -> None:
            errors.append(message)

          def normalize_local_path(raw: str, base_dir: pathlib.Path):
            parsed = urllib.parse.urlsplit(raw.strip())
            if parsed.scheme or parsed.netloc:
              if parsed.scheme in {"http", "https"}:
                netloc = parsed.netloc.lower()
                if netloc == LOCAL_DOMAIN:
                  path = urllib.parse.unquote(parsed.path or "/")
                else:
                  return None
              else:
                return None
            else:
              path = urllib.parse.unquote(parsed.path)

            if not path or path.startswith("#"):
              return None

            candidate = pathlib.PurePosixPath(path.lstrip("/")) if path.startswith("/") else pathlib.PurePosixPath(base_dir.as_posix(), path)
            rel_path = pathlib.Path(*candidate.parts)
            return rel_path

          def check_local_reference(raw: str, source: pathlib.Path, base_dir: pathlib.Path):
            local_path = normalize_local_path(raw, base_dir)
            if local_path is None:
              return

            if str(local_path) == "":
              return

            target = REPO / local_path
            if raw.startswith("/") and raw.endswith("/"):
              target = REPO / local_path / "index.html"
            elif target.is_dir():
              target = target / "index.html"

            if not target.exists():
              err(f"{source}: missing local reference '{raw}' -> '{target.as_posix()}'")

          required_files = [
            "index.html",
            "writeups.html",
            "roadmap.html",
            ".well-known/security.txt",
            "sitemap.xml",
            "robots.txt",
            "assets/css/main.css",
            "assets/js/matrix.js",
          ]
          for required in required_files:
            if not (REPO / required).exists():
              err(f"missing required file: {required}")

          html_files = sorted(REPO.glob("*.html"))
          link_attr_pattern = re.compile(r"""(?:href|src)\s*=\s*["']([^"']+)["']""", re.IGNORECASE)
          script_block_pattern = re.compile(r"<script\b[^>]*>(.*?)</script>", re.IGNORECASE | re.DOTALL)
          post_link_pattern = re.compile(r"writeups\.html\?post=([a-z0-9-]+)")

          for html_file in html_files:
            html = html_file.read_text(encoding="utf-8")
            try:
              html.encode("utf-8").decode("utf-8")
            except UnicodeError:
              err(f"{html_file}: invalid UTF-8")
            for raw_ref in link_attr_pattern.findall(html):
              check_local_reference(raw_ref, html_file, html_file.parent)

            for i, script in enumerate(script_block_pattern.findall(html), start=1):
              if "<script" in script.lower():
                err(f"{html_file}: malformed inline script block #{i}")

            if html_file.name == "writeups.html":
              known_posts = {p.stem for p in REPO.glob("posts/*.md")}
              for slug in post_link_pattern.findall(html):
                if slug not in known_posts:
                  err(f"{html_file}: linked post slug '{slug}' has no matching posts/{slug}.md")

          css_url_pattern = re.compile(r"url\(([^)]+)\)")
          for css_file in sorted(REPO.glob("assets/css/*.css")):
            css_content = css_file.read_text(encoding="utf-8")
            for raw_url in css_url_pattern.findall(css_content):
              cleaned = raw_url.strip().strip("'\"")
              if not cleaned or cleaned.startswith(("data:", "#")):
                continue
              check_local_reference(cleaned, css_file, css_file.parent)

          markdown_ref_pattern = re.compile(r"""!?\[[^\]]*\]\(([^)]+)\)""")
          for md_file in sorted(REPO.glob("posts/*.md")):
            content = md_file.read_text(encoding="utf-8")
            for raw_ref in markdown_ref_pattern.findall(content):
              check_local_reference(raw_ref, md_file, md_file.parent)

          robots_path = REPO / "robots.txt"
          if robots_path.exists():
            robots_lines = robots_path.read_text(encoding="utf-8").splitlines()
            for line in robots_lines:
              if line.lower().startswith("sitemap:"):
                sitemap_ref = line.split(":", 1)[1].strip()
                check_local_reference(sitemap_ref, robots_path, robots_path.parent)

          sitemap_path = REPO / "sitemap.xml"
          if sitemap_path.exists():
            try:
              root = ET.parse(sitemap_path).getroot()
            except ET.ParseError as parse_error:
              err(f"sitemap.xml: invalid XML ({parse_error})")
            else:
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              for loc in root.findall(".//sm:loc", ns):
                if loc.text:
                  check_local_reference(loc.text.strip(), sitemap_path, sitemap_path.parent)

          sec_path = REPO / ".well-known/security.txt"
          if sec_path.exists():
            fields = {}
            for raw_line in sec_path.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or ":" not in line:
                continue
              key, value = line.split(":", 1)
              fields[key.strip().lower()] = value.strip()

            for required_key in ("contact", "expires"):
              if required_key not in fields:
                err(f"security.txt: missing required field '{required_key}'")

            if "expires" in fields:
              expires_raw = fields["expires"].replace("Z", "+00:00")
              try:
                expires_dt = dt.datetime.fromisoformat(expires_raw)
                if expires_dt.tzinfo is None:
                  expires_dt = expires_dt.replace(tzinfo=dt.timezone.utc)
              except ValueError:
                err("security.txt: Expires is not a valid ISO-8601 timestamp")
              else:
                if expires_dt <= dt.datetime.now(dt.timezone.utc):
                  err("security.txt: Expires must be a future date/time")

            for key in ("contact", "canonical", "policy"):
              if key in fields:
                check_local_reference(fields[key], sec_path, sec_path.parent)

          if errors:
            print("Validation errors:")
            for item in errors:
              print(f" - {item}")
            raise SystemExit(1)

          print("Static reference, sitemap, and security.txt checks passed.")
          PY

      - name: Check JavaScript syntax (assets + inline scripts)
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p /tmp/inline-js-check
          python3 - <<'PY'
          import pathlib
          import re

          out_dir = pathlib.Path("/tmp/inline-js-check")
          pattern = re.compile(r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>", re.IGNORECASE | re.DOTALL)

          for html_file in sorted(pathlib.Path(".").glob("*.html")):
            html = html_file.read_text(encoding="utf-8")
            for idx, content in enumerate(pattern.findall(html), start=1):
              target = out_dir / f"{html_file.stem}.inline.{idx}.js"
              target.write_text(content.strip() + "\n", encoding="utf-8")
          PY

          for js_file in assets/js/*.js /tmp/inline-js-check/*.js; do
            node --check "$js_file"
          done

      - name: Secret-pattern scan (no secret echo)
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          patterns = {
            "private_key_block": re.compile(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----"),
            "github_token": re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b"),
            "github_pat": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
            "aws_access_key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
            "slack_token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
            "generic_secret_assignment": re.compile(
              r"(?i)\b(?:password|passwd|pwd|secret|token|api[_-]?key)\b\s*[:=]\s*['\"][^'\"]{10,}['\"]"
            ),
          }

          ignored_paths = {
            ".gitignore",
          }

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []

          for rel in tracked:
            if rel in ignored_paths:
              continue
            path = pathlib.Path(rel)
            if not path.is_file():
              continue
            data = path.read_bytes()
            if b"\x00" in data:
              continue

            text = data.decode("utf-8", errors="ignore")
            for line_no, line in enumerate(text.splitlines(), start=1):
              for name, regex in patterns.items():
                if regex.search(line):
                  findings.append((rel, line_no, name))

          if findings:
            print("Potential secrets detected (content redacted):")
            for rel, line_no, name in findings:
              print(f" - {rel}:{line_no} [{name}]")
            raise SystemExit(1)

          print("No obvious secret patterns detected.")
          PY
