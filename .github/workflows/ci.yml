name: Portfolio CI Linter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Key Files Exist
        run: |
          test -f index.html || exit 1
          test -f writeups.html || exit 1
          test -f roadmap.html || exit 1
          test -f .well-known/security.txt || exit 1
          echo "All critical security and web artifacts verified."

      - name: Validate Markdown Posts
        run: |
          posts=$(find posts -maxdepth 1 -type f -name '*.md' -print)
          test -n "$posts"
          for post in $posts; do
            test "$(grep -c '^```' "$post")" -gt 0
            test $(( $(grep -c '^```' "$post") % 2 )) -eq 0
          done
          grep -Fq "linux-permissions" writeups.html
          grep -Fq "ssh-hardening" writeups.html
          grep -Fq "incident-response-basics" writeups.html
          test -f contact.html
          test -f LICENSE
          echo "Markdown posts and catalog links verified."
