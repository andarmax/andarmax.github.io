<style>
:root{--bg:#050b08;--line:rgba(0,255,65,0.6);--primary:#00ff41;--primary-soft:#8fff8f;--text:#dfffe9;--muted:#9ec0a6;}
*{box-sizing:border-box;}body{margin:0;font-family:Consolas,monospace;background:radial-gradient(circle at top,rgba(0,255,65,0.18),transparent 60%),linear-gradient(180deg,#020805,var(--bg));color:var(--primary);overflow-x:hidden;}
canvas#matrix{position:fixed;inset:0;z-index:-1;opacity:0.42;}
.navbar{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;padding:28px 18px 10px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);background:rgba(5,11,8,0.35);}
.nav-btn{padding:12px 18px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--primary);background:rgba(0,0,0,0.7);}
.nav-btn:hover{background:var(--primary);color:#000;}
.container{max-width:1040px;margin:0 auto;padding:18px 18px 60px;}
h1{text-align:center;font-size:clamp(2.4rem,5vw,3.6rem);text-shadow:0 0 12px rgba(0,255,65,0.7);margin:0;}
.card{background:linear-gradient(180deg,rgba(10,18,15,0.9),rgba(5,11,8,0.82));border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin:20px 0;}
.btn{padding:12px 20px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:rgba(0,0,0,0.5);display:inline-block;}
.btn:hover{background:var(--primary);color:#000;}
@media(max-width:640px){.navbar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:10px;padding:12px 10px;scrollbar-width:none;}.navbar::-webkit-scrollbar{display:none;}.nav-btn{flex:0 0 auto;white-space:nowrap;padding:10px 14px;font-size:0.82rem;}.btn{width:100%;text-align:center;}}

<body>

<nav class="navbar"><a class="nav-btn" href="index.html">HOME</a><a class="nav-btn" href="roadmap.html">ROADMAP</a><a class="nav-btn" href="writeups.html">NOTES</a></nav>

<h1>STUDY NOTES // ノート</h1><p style="text-align:center;color:#8fff8f;">Linux • Networking • Cyber // <span id="auto-date"></span></p>

</div>
<script>
const canvas=document.getElementById('matrix');const ctx=canvas.getContext('2d');
function setSize(){canvas.width=innerWidth;canvas.height=innerHeight;}
const matrixChars='アカサタナハマヤラワイキシチニヒミリウクスツヌフムユルエケセテネヘメレオコソトノホモヨロヲン0123456789ANDAR@#$%';
let drops=[];function init(){drops=Array.from({length:Math.floor(canvas.width/14)},()=>Math.random()*-100);}
function draw(){ctx.fillStyle='rgba(5,11,8,0.12)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font='16px monospace';for(let i=0;i<drops.length;i++){ctx.fillStyle=i%3===0?'#00ff41':'#7fffbf';ctx.fillText(matrixChars[Math.floor(Math.random()*matrixChars.length)],i*14,drops[i]*16);if(drops[i]*16>canvas.height && Math.random()>0.975)drops[i]=0;drops[i]++;}}
setSize();init();setInterval(draw,70);addEventListener('resize',()=>{setSize();init();});
function tick(){document.getElementById('auto-date').textContent=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Jakarta'});}tick();
</script>
</body>
